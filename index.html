<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 3.0 - 60b - MANHXD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: sổ tay học tập. Thanh tab trên cùng, nội dung một cột rộng tối đa 1080px, ngăn kéo phát âm trượt từ phải (điện thoại: từ dưới lên). */
:root {
  --paper: #f3f6f5;
  --surface: #ffffff;
  --sunk: #e9efed;
  --ink: #15201d;
  --muted: #56665f;
  --line: #d6dfdb;
  --jade: #0d6b57;
  --jade-ink: #ffffff;
  --jade-soft: #dcefe8;
  --gold: #9a6b10;
  --ok: #1d7a4b;
  --ok-soft: #dcf1e4;
  --bad: #b8371f;
  --bad-soft: #fbe3dd;
  --t1: #c62828; --t2: #2e7d32; --t3: #1565c0; --t4: #7b1fa2; --t5: #6b7772;
  --tongue: #d9736c; --tongue-edge: #a84d47; --flesh: #f1d3c4; --flesh-edge: #b88a76; --tooth: #fbfaf6; --air: #1f8fbf; --lip: #d98a80; --mouth: #3a1614;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-hz: "Noto Serif SC", "Songti SC", "SimSun", "Noto Sans SC", "PingFang SC", serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1513; --surface: #151e1b; --sunk: #1b2622; --ink: #e4ece9; --muted: #98aaa3; --line: #26332f;
  --jade: #4cc29f; --jade-ink: #06231b; --jade-soft: #163129; --gold: #e0b453;
  --ok: #5fd08e; --ok-soft: #143323; --bad: #f08068; --bad-soft: #3a1a14;
  --t1: #ff6b6b; --t2: #6fcf73; --t3: #64a8ff; --t4: #d18cf0; --t5: #9aa8a3;
  --tongue: #d77a72; --tongue-edge: #f0a199; --flesh: #4a3a33; --flesh-edge: #a07c6c; --tooth: #e8e6df; --air: #5cc8f0; --lip: #b8665c; --mouth: #070404;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0e1513; --surface: #151e1b; --sunk: #1b2622; --ink: #e4ece9; --muted: #98aaa3; --line: #26332f;
  --jade: #4cc29f; --jade-ink: #06231b; --jade-soft: #163129; --gold: #e0b453;
  --ok: #5fd08e; --ok-soft: #143323; --bad: #f08068; --bad-soft: #3a1a14;
  --t1: #ff6b6b; --t2: #6fcf73; --t3: #64a8ff; --t4: #d18cf0; --t5: #9aa8a3;
  --tongue: #d77a72; --tongue-edge: #f0a199; --flesh: #4a3a33; --flesh-edge: #a07c6c; --tooth: #e8e6df; --air: #5cc8f0; --lip: #b8665c; --mouth: #070404;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.hz { font-family: var(--font-hz); font-weight: 500; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
h1, h2, h3 { line-height: 1.25; text-wrap: balance; margin: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.seal { width: 34px; height: 34px; border-radius: 8px; background: var(--jade); color: var(--jade-ink); display: grid; place-items: center; font-family: var(--font-hz); font-weight: 700; font-size: 20px; }
.brand small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); line-height: 1.2; }
.stats { margin-left: auto; display: flex; gap: 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 700; }
.stats .pts b { color: var(--gold); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab:hover { background: var(--sunk); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--jade-soft); color: var(--jade); font-weight: 600; }
.tabbar { border-top: 1px solid var(--line); }
.tabbar .wrap { padding-block: 6px; }

main .wrap { padding-block: 28px 64px; display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
section[role="tabpanel"] { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lead { color: var(--muted); max-width: 65ch; margin: 6px 0 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--jade); }
.btn.primary { background: var(--jade); color: var(--jade-ink); border-color: var(--jade); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-weight: 500; }
.chip.jade { background: var(--jade-soft); color: var(--jade); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
select { max-width: 100%; text-overflow: ellipsis; }
.quiz-setup { min-width: 0; grid-template-columns: minmax(0, 1fr); }
.quiz-setup .row { max-width: 100%; min-width: 0; }
.quiz-setup label { display: flex; gap: 6px; align-items: center; max-width: 100%; min-width: 0; }
.quiz-setup select { min-width: 0; flex: 1; }
select, input[type="search"] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }

/* Tone colors */
.tone1 { color: var(--t1); } .tone2 { color: var(--t2); } .tone3 { color: var(--t3); } .tone4 { color: var(--t4); } .tone5 { color: var(--t5); }
.py { font-weight: 500; }

/* Speakable */
.say { cursor: pointer; border-radius: 6px; transition: background .15s; }
.say:hover { background: var(--jade-soft); }
.say.playing { background: var(--jade-soft); box-shadow: inset 0 -2px 0 var(--jade); }

/* Roadmap */
.bands { display: grid; gap: 28px; }
.band h2 { font-size: 18px; display: flex; gap: 10px; align-items: baseline; }
.band h2 .hz { color: var(--jade); font-size: 22px; }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 12px; }
.level { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 10px; align-content: start; }
.level.current { border-color: var(--jade); }
.level h3 { font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
.level p { margin: 0; color: var(--muted); font-size: 14px; }
.figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-variant-numeric: tabular-nums; }
.figs div { background: var(--sunk); border-radius: 6px; padding: 6px 8px; }
.figs b { display: block; font-size: 16px; }
.figs span { font-size: 11px; color: var(--muted); }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--jade); border-radius: 99px; }
.lesson-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lesson-list li button, .lesson-list li div { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.lesson-list li button:hover { border-color: var(--jade); }
.lesson-list li div { cursor: default; border-style: dashed; color: var(--muted); font-size: 13px; }
.lesson-list .no { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; width: 44px; flex: none; }
.lesson-list .t { flex: 1; min-width: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.dot.done { background: var(--ok); border-color: var(--ok); }

/* Lesson */
.lesson-head { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.lesson-head .big { font-size: 64px; line-height: 1; color: var(--jade); }
.lesson-head h1 { font-size: 26px; }
.goals { margin: 8px 0 0; padding-left: 20px; color: var(--muted); }
.sec-title { font-size: 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; cursor: pointer; text-align: left; position: relative; }
.card:hover { border-color: var(--jade); }
.card .hz { font-size: 34px; line-height: 1.2; }
.card .hv { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.card .vi { font-size: 14px; }
.card .learned { position: absolute; top: 10px; right: 10px; }
.dialogue { display: grid; gap: 10px; }
.dl { display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.dl:last-child { border-bottom: 0; }
.dl .who { font-size: 13px; color: var(--muted); padding-top: 6px; }
.dl .line-hz { font-size: 24px; }
.dl .line-py { font-size: 14px; }
.dl .line-vi { font-size: 14px; color: var(--muted); }
.word { padding: 0 2px; }
.word.linked { border-bottom: 1px dashed var(--jade); }
body.hide-py .line-py, body.hide-py .card .py { visibility: hidden; }
.grammar { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grammar .panel h3 { font-size: 16px; margin-bottom: 6px; }
.grammar p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
.ex { padding: 6px 8px; border-radius: 6px; display: block; }
.ex .hz { font-size: 20px; margin-right: 8px; }
.ex small { display: block; color: var(--muted); }
.focus { display: flex; flex-wrap: wrap; gap: 8px; }
.focus button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
.focus button:hover { border-color: var(--jade); color: var(--jade); }

/* Pinyin board */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.ptile { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px; cursor: pointer; text-align: center; display: grid; gap: 0; }
.ptile:hover { border-color: var(--jade); }
.ptile b { font-size: 20px; }
.ptile span { font-size: 12px; color: var(--muted); }
.ptile .hz { font-size: 15px; color: var(--ink); }
.group-label { font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.tones { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

/* Vocab table */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--sunk); }
tr:last-child td { border-bottom: 0; }
td.n { font-variant-numeric: tabular-nums; color: var(--muted); width: 40px; }
td .hz { font-size: 24px; }
body.cover-vi td.vi-cell span { filter: blur(6px); transition: filter .2s; cursor: pointer; }
body.cover-vi td.vi-cell span:hover { filter: none; }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; }
.mark { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.mark.on { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); font-weight: 600; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 50%; width: 32px; height: 32px; display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn:hover { border-color: var(--jade); color: var(--jade); }
.iconbtn svg { width: 14px; height: 14px; fill: currentColor; }

/* Quiz */
.quiz-setup { display: grid; gap: 14px; }
.quiz-box { display: grid; gap: 18px; }
.qtop { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.qtop .count { font-weight: 600; }
.timer { flex: 1; min-width: 140px; display: flex; align-items: center; gap: 8px; }
.timer .bar { flex: 1; height: 8px; }
.timer .bar i { transition: width .25s linear; }
.timer.low .bar i { background: var(--bad); }
.timer.low span { color: var(--bad); }
.qprompt { text-align: center; padding: 18px 10px; display: grid; gap: 6px; justify-items: center; }
.qprompt .hz { font-size: 64px; line-height: 1.1; }
.qprompt .ask { color: var(--muted); font-size: 14px; }
.qprompt .vi { font-size: 24px; font-weight: 600; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; cursor: pointer; text-align: left; font-size: 16px; display: flex; gap: 10px; align-items: center; }
.opt:hover:not(:disabled) { border-color: var(--jade); }
.opt .k { width: 24px; height: 24px; border-radius: 6px; background: var(--sunk); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; color: var(--muted); }
.opt .hz { font-size: 26px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.feedback { min-height: 26px; font-weight: 600; text-align: center; }
.feedback.ok { color: var(--ok); } .feedback.bad { color: var(--bad); }
.result { text-align: center; display: grid; gap: 10px; justify-items: center; }
.result .score { font-size: 56px; font-weight: 700; color: var(--jade); font-variant-numeric: tabular-nums; line-height: 1; }
.review { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; text-align: left; width: 100%; max-width: 560px; }
.review li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--sunk); font-size: 14px; }
.review li.bad { background: var(--bad-soft); }
.history { width: 100%; }
.history td, .history th { padding: 6px 10px; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 40; }
.drawer { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 20px; display: grid; gap: 16px; align-content: start; animation: slide .22s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } }
.drawer .close { justify-self: end; }
.d-head { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.d-head .hz { font-size: 72px; line-height: 1; }
.d-head .py { font-size: 22px; }
.d-head .meta { color: var(--muted); font-size: 14px; }
.syls { display: flex; gap: 6px; flex-wrap: wrap; }
.syl { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 12px; cursor: pointer; font-weight: 600; font-size: 16px; }
.syl[aria-pressed="true"] { border-color: var(--jade); background: var(--jade-soft); }
.stage { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }
.stage figure { margin: 0; background: var(--sunk); border-radius: var(--r); padding: 8px; display: grid; gap: 4px; }
.stage figcaption { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; text-align: center; }
.stage svg { width: 100%; height: auto; display: block; }
.side-col { display: grid; gap: 10px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.steps li { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px; display: grid; gap: 2px; transition: background .2s, border-color .2s; }
.steps li b { font-size: 13px; }
.steps li.now { border-color: var(--jade); background: var(--jade-soft); }
.notice { font-size: 13px; color: var(--muted); background: var(--sunk); border-radius: 8px; padding: 8px 10px; }
.notice.warn { color: var(--bad); background: var(--bad-soft); }

/* SVG articulation */
.art .flesh { fill: var(--flesh); stroke: var(--flesh-edge); stroke-width: 1.5; }
.art .cavity { fill: var(--surface); stroke: var(--flesh-edge); stroke-width: 1.5; }
.art .tooth { fill: var(--tooth); stroke: var(--flesh-edge); stroke-width: 1; }
.art .tongue { fill: var(--tongue); stroke: var(--tongue-edge); stroke-width: 1.5; }
.art .lbl { fill: var(--muted); font-size: 8px; font-family: var(--font-ui); }
.art .air { fill: none; stroke: var(--air); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 4 7; opacity: 0; }
.art .air.on { opacity: .9; animation: flow .6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -22; } }
.art .puff { fill: var(--air); opacity: 0; }
.art .puff.on { animation: puff .9s ease-out infinite; }
@keyframes puff { 0% { opacity: .8; transform: translateX(0) scale(.6); } 100% { opacity: 0; transform: translateX(-16px) scale(1.4); } }
.art .voice { fill: none; stroke: var(--jade); stroke-width: 2; opacity: 0; }
.art .voice.on { opacity: 1; animation: buzz .12s linear infinite alternate; }
@keyframes buzz { to { transform: translateX(1.5px); } }
.art .hit { fill: none; stroke: var(--jade); stroke-width: 2; opacity: 0; }
.art .hit.on { opacity: 1; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.tonechart .grid line { stroke: var(--line); stroke-width: 1; }
.tonechart text { fill: var(--muted); font-size: 9px; font-family: var(--font-ui); }
.tonechart .curve { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; background: currentColor; vertical-align: middle; margin-right: 4px; }

/* Bài giảng trên lớp */
.lect { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; align-items: start; }
.lect-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 130px); }
.lect-list button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.lect-list button:hover { border-color: var(--jade); }
.lect-list button[aria-current="true"] { border-color: var(--jade); background: var(--jade-soft); }
.lect-list .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; }
.lect-body { display: grid; gap: 16px; min-width: 0; }
.lect-body .panel h3 { font-size: 16px; margin-bottom: 8px; }
.lect-body .panel p { margin: 0; white-space: pre-line; }
.lect-body .tip { border-left: 3px solid var(--gold); background: var(--surface); border-radius: 0 var(--r) var(--r) 0; padding: 12px 16px; }
.lect-body figure { margin: 0; }
.lect-body figure img { max-width: 100%; height: auto; border-radius: var(--r); border: 1px solid var(--line); display: block; }
.lect-body figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
.lect-body table { min-width: 0; }
.lect-body .hzline .word { font-family: var(--font-hz); }

/* Trò chơi */

.gprompt { text-align: center; display: grid; gap: 4px; justify-items: center; }

.gprompt .vi { font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.gline { display: flex; gap: 8px; }
.gline .ginput { flex: 1; min-width: 0; }
.ginput { width: 100%; font: inherit; font-size: 18px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.ginput:focus { outline: none; border-color: var(--jade); box-shadow: 0 0 0 3px var(--jade-soft); }

.gstage { position: relative; overflow: hidden; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, var(--sunk), var(--surface)); height: clamp(260px, 50vh, 440px); touch-action: manipulation; user-select: none; -webkit-user-select: none; }

.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--jade-soft); border-top: 2px solid var(--jade); transition: background .2s; }

.drop.miss { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); opacity: 0; }
.beam { position: absolute; bottom: 10px; width: 3px; margin-left: -1.5px; background: var(--jade); border-radius: 2px; animation: fade .3s forwards; }
@keyframes fade { to { opacity: 0; } }
.meteor { position: absolute; top: 0; left: 50%; min-width: 84px; height: 84px; padding: 0 12px; border-radius: 42px; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, var(--surface), var(--sunk)); border: 2px solid var(--gold); box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 18%, transparent); will-change: transform; }
.meteor::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 20px; height: 80px; margin-left: -10px; border-radius: 10px; background: linear-gradient(to top, color-mix(in srgb, var(--gold) 55%, transparent), transparent); }
.meteor .hz { line-height: 1; white-space: nowrap; }
.meteor.boom { border-color: var(--ok); animation: boom .6s forwards; }

@keyframes boom { to { opacity: 0; scale: 1.7; } }
.bubble { position: absolute; top: 0; left: 0; width: 76px; height: 76px; padding: 0; border-radius: 50%; border: 2px solid var(--jade); background: radial-gradient(circle at 32% 28%, var(--surface) 0 28%, var(--jade-soft) 70%); display: grid; place-items: center; cursor: pointer; color: var(--ink); will-change: transform; transition: opacity .35s, scale .35s; }
.bubble .hz { line-height: 1; white-space: nowrap; }
.bubble .k { position: absolute; top: 3px; right: 9px; font-size: 11px; color: var(--muted); font-weight: 600; }
.bubble.pop { border-color: var(--ok); background: var(--ok-soft); opacity: 0; scale: 1.5; }
.bubble.wrong { border-color: var(--bad); background: var(--bad-soft); opacity: 0; scale: .7; transition-duration: .6s; }
.mboard { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mcol { display: grid; gap: 8px; align-content: start; }
.mtile { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 10px; min-height: 58px; cursor: pointer; font-size: 14px; display: grid; place-items: center; text-align: center; overflow-wrap: anywhere; line-height: 1.3; transition: opacity .3s, background .15s; }
.mtile:hover { border-color: var(--jade); }
.mtile.sel { border-color: var(--jade); background: var(--jade-soft); }
.mtile.bad { border-color: var(--bad); background: var(--bad-soft); animation: shake .3s; }
.mtile.done { border-color: var(--ok); background: var(--ok-soft); opacity: 0; cursor: default; }
.mem { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 560px; margin: 0 auto; }
.mcard { aspect-ratio: 3 / 4; border: 0; padding: 0; background: none; cursor: pointer; perspective: 700px; min-width: 0; }
.mcard .in { position: relative; display: block; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mcard.open .in, .mcard.done .in { transform: rotateY(180deg); }
.mcard .b, .mcard .f { position: absolute; inset: 0; border-radius: var(--r); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; padding: 6px; text-align: center; overflow: hidden; overflow-wrap: anywhere; line-height: 1.25; }
.mcard .b { background: var(--jade) repeating-linear-gradient(45deg, transparent 0 8px, rgb(255 255 255 / .09) 8px 16px); color: var(--jade-ink); font-size: 24px; font-weight: 700; }
.mcard .f { transform: rotateY(180deg); background: var(--surface); border: 1.5px solid var(--line); font-size: 13px; font-weight: 500; }
.mcard.done .f { border-color: var(--ok); background: var(--ok-soft); }
.bridge { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr) 20px; align-items: end; padding-top: 30px; }
.cliff { height: 70px; background: var(--jade-soft); border: 2px solid var(--jade); }
.cliff.l { border-radius: 8px 0 0 8px; border-right: 0; }
.cliff.r { border-radius: 0 8px 8px 0; border-left: 0; }
.deck { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 4px; border-bottom: 3px dashed var(--line); min-height: 60px; align-items: flex-end; justify-content: center; }
.plank { height: 46px; padding: 0 8px; border-radius: 6px; border: 1.5px dashed var(--line); display: grid; place-items: center; font-family: var(--font-hz); font-size: 22px; color: transparent; }
.plank.on { border-style: solid; border-color: var(--gold); background: color-mix(in srgb, var(--gold) 20%, var(--surface)); color: var(--ink); animation: lay .25s ease-out; }
@keyframes lay { from { transform: translateY(-14px); opacity: 0; } }
.bridge.done .deck { border-bottom: 3px solid var(--gold); }
.walker { position: absolute; top: 4px; left: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--jade); transition: left 1.4s ease-in-out; }
.bridge.done .walker { left: calc(100% - 18px); }
.wchips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.wgrid { display: grid; gap: 6px; justify-content: center; }

.wcell { aspect-ratio: 1; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: 20px; text-transform: uppercase; background: var(--surface); min-width: 0; }

.wcell.p, .key.p { background: var(--gold); border-color: var(--gold); color: var(--surface); }
.wcell.a { background: var(--sunk); border-color: var(--sunk); color: var(--muted); }
.key.a { opacity: .45; }
.kb { display: grid; gap: 6px; width: 100%; max-width: 520px; margin: 0 auto; }
.kbr { display: flex; gap: 4px; justify-content: center; }
.key { flex: 1 1 0; min-width: 0; max-width: 44px; height: 46px; padding: 0; border: 1px solid transparent; border-radius: 6px; background: var(--sunk); font-weight: 600; cursor: pointer; text-transform: uppercase; }

@media (max-width: 560px) {

@media (max-width: 820px) {
  .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (max-width: 560px) {
